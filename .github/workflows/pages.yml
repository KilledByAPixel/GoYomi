# Publishes the game to GitHub Pages on every push to master: runs the tests,
# builds the site with tools/build.js (bundled code, every file stamped with a
# version), and deploys it. Needs Settings > Pages > Source: "GitHub Actions".
name: Publish to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: # a "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tools/build.js --no-zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
